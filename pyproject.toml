[project]
name = "autonomous-trading-agent"
version = "0.0.1"
description = "US-first autonomous trading agent — workspace root"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "apps/agents", "apps/mcp_server", "packages/broker", "packages/engine"]

# Toolchain the Makefile targets shell out to (`make test` / `lint` /
# `typecheck`). These were configured below ([tool.pytest.ini_options],
# [tool.ruff], [tool.mypy]) but never declared, so a clean clone failed
# with "No module named pytest". Installed by `uv sync` into the root env.
[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "anyio>=4.6.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "httpx2>=2.9.1",
  # python-jose ships no inline type markers — google_oauth.py's RS256/JWKS
  # verification imports it; without stubs mypy reports import-untyped.
  "types-python-jose>=3.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/versions/*.py"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "ASYNC",
  "SIM",
  "RUF",
]
ignore = [
  "E501",    # line length handled by formatter
  # This codebase deliberately uses typographic punctuation in prose —
  # em-dashes, →, ×, ≥ — because the comments explain WHY and are read by
  # humans, not parsed. Flagging them as "ambiguous unicode" is noise.
  "RUF001", "RUF002", "RUF003",
  # `class Side(str, Enum)` is NOT interchangeable with `StrEnum`: str() on a
  # StrEnum member yields the value, on a (str, Enum) member the member name.
  # Serialized payloads depend on the current behavior — don't auto-migrate.
  "UP042",
]

[tool.ruff.lint.isort]
# The workspace packages. Without this ruff sorts them in with PyPI deps
# (``engine`` lands between ``alembic`` and ``sqlalchemy``), which makes the
# local-vs-external split invisible at a glance.
known-first-party = ["app", "broker", "engine", "mcp_server", "trading_agents"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/agents/tests", "apps/mcp_server/tests", "packages/broker/tests", "packages/engine/tests"]
filterwarnings = ["error"]
